services:
  app:
    image: ${OPSPULSE_IMAGE:?Set OPSPULSE_IMAGE to the approved GHCR image}
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      LOG_LEVEL: INFO
      OPSPULSE_RELEASE: ${OPSPULSE_RELEASE:?Set OPSPULSE_RELEASE to the approved commit}
      OPSPULSE_DISK_PATH: /app
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
