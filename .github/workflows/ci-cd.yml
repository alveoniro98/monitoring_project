name: OpsPulse CI and approved EC2 deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: Deploy this reviewed main-branch revision to the protected production environment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, build, scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: opspulse:ci
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opspulse:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH

  deploy:
    name: Deploy to approved EC2 host
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_ec2 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure verified SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          VERIFIED_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          test -n "$DEPLOY_KEY" || { echo "EC2_SSH_PRIVATE_KEY is required"; exit 1; }
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          test -n "$VERIFIED_KNOWN_HOSTS" || { echo "EC2_KNOWN_HOSTS is required"; exit 1; }
          printf '%s\n' "$VERIFIED_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
      - name: Prepare deployment bundle
        run: tar --exclude=.git --exclude=.env -czf "$RUNNER_TEMP/opspulse.tar.gz" .
      - name: Copy and deploy
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          test -n "$EC2_HOST" && test -n "$EC2_USER" || { echo "EC2_HOST and EC2_USER are required"; exit 1; }
          [[ "$EC2_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "EC2_HOST contains unsupported characters"; exit 1; }
          [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*[$]?$ ]] || { echo "EC2_USER contains unsupported characters"; exit 1; }
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$RUNNER_TEMP/opspulse.tar.gz" "$EC2_USER@$EC2_HOST:/tmp/opspulse.tar.gz"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes "$EC2_USER@$EC2_HOST" \
            "mkdir -p /opt/opspulse && tar -xzf /tmp/opspulse.tar.gz -C /opt/opspulse && cd /opt/opspulse && bash scripts/deploy-ec2.sh $RELEASE && docker compose ps"
      - name: Verify deployment health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error "http://$EC2_HOST/health"; then exit 0; fi
            sleep 5
          done
          echo "Post-deployment health check failed after $attempt attempts"
          exit 1
