name: OpsPulse CI and approved EC2 deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: Deploy this reviewed main-branch revision to the protected production environment
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, build, scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.6"
      - name: Check Terraform formatting
        run: terraform -chdir=infrastructure/terraform fmt -check -recursive
      - name: Initialize Terraform without a backend
        run: terraform -chdir=infrastructure/terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate Terraform
        run: terraform -chdir=infrastructure/terraform validate
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest -q
      - uses: docker/setup-buildx-action@v3
      - name: Build image for scan
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: opspulse:ci
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: opspulse:ci
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Save scanned image for publication
        run: docker save --output "$RUNNER_TEMP/opspulse-image.tar" opspulse:ci
      - name: Upload scanned image
        uses: actions/upload-artifact@v4
        with:
          name: opspulse-image
          path: ${{ runner.temp }}/opspulse-image.tar
          retention-days: 1

  publish:
    name: Publish approved image to GHCR
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@v4
        with:
          name: opspulse-image
          path: ${{ runner.temp }}
      - name: Publish immutable image to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/alveoniro98/opspulse
        run: |
          docker load --input "$RUNNER_TEMP/opspulse-image.tar"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker tag opspulse:ci "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:$GITHUB_SHA"

  deploy:
    name: Deploy to approved EC2 host
    needs: [validate, publish]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_to_ec2 && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GitHub OIDC claims for trust-policy diagnostics
        run: |
          token=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          printf '%s' "$token" | python3 -c '
          import base64, json, sys
          payload = sys.stdin.read().split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss", "aud", "sub", "repository", "ref", "environment"):
              if key in claims:
                  print(f"{key}={claims[key]}")
          '
      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-southeast-3' }}
          role-session-name: opspulse-${{ github.run_id }}
      - name: Deploy through AWS Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-3' }}
          RELEASE: ${{ github.sha }}
          IMAGE: ghcr.io/alveoniro98/opspulse:${{ github.sha }}
        run: |
          test -n "$EC2_INSTANCE_ID" || { echo "Set the EC2_INSTANCE_ID environment variable"; exit 1; }
          [[ "$EC2_INSTANCE_ID" =~ ^i-[a-f0-9]+$ ]] || { echo "EC2_INSTANCE_ID has an invalid format"; exit 1; }
          [[ "$RELEASE" =~ ^[a-f0-9]{40}$ ]] || { echo "Release is not a full commit SHA"; exit 1; }

          remote_commands=$(cat <<EOF
          set -Eeuo pipefail
          install -d -m 0755 /opt/opspulse
          curl --fail --silent --show-error --location --retry 3 "https://raw.githubusercontent.com/alveoniro98/monitoring_project/$RELEASE/deployment/ec2/compose.yaml" --output /opt/opspulse/compose.candidate.yaml
          curl --fail --silent --show-error --location --retry 3 "https://raw.githubusercontent.com/alveoniro98/monitoring_project/$RELEASE/deployment/ec2/deploy.sh" --output /opt/opspulse/deploy.candidate.sh
          chmod 0755 /opt/opspulse/deploy.candidate.sh
          mv /opt/opspulse/deploy.candidate.sh /opt/opspulse/deploy.sh
          bash /opt/opspulse/deploy.sh "$RELEASE" "$IMAGE"
          EOF
          )
          parameters=$(jq -cn --arg command "$remote_commands" '{commands: [$command]}')
          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$parameters" \
            --timeout-seconds 1800 \
            --comment "OpsPulse deployment $RELEASE" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 180); do
            if status=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query 'Status' \
              --output text 2>&1); then
              :
            elif [[ "$status" == *InvocationDoesNotExist* ]]; then
              status=Pending
            else
              printf 'Unable to read Systems Manager invocation status: %s\n' "$status" >&2
              exit 1
            fi
            case "$status" in
              Success)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut|DeliveryTimedOut|ExecutionTimedOut|Undeliverable|Terminated|Cancelling)
                aws ssm get-command-invocation --region "$AWS_REGION" --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" --query '{status:Status,stderr:StandardErrorContent,stdout:StandardOutputContent}' --output json
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out after $attempt polls waiting for Systems Manager command $command_id"
          exit 1
      - name: Verify public HTTP health endpoint
        env:
          EC2_PUBLIC_IP: ${{ vars.EC2_PUBLIC_IP }}
        run: |
          test -n "$EC2_PUBLIC_IP" || { echo "Set the EC2_PUBLIC_IP environment variable"; exit 1; }
          [[ "$EC2_PUBLIC_IP" =~ ^[0-9.]+$ ]] || { echo "EC2_PUBLIC_IP has an invalid format"; exit 1; }
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 5 "http://$EC2_PUBLIC_IP/health"; then exit 0; fi
            sleep 5
          done
          echo "Post-deployment health check failed after $attempt attempts"
          exit 1
